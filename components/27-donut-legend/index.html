/* ---------- Base ---------- */
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--page);color:var(--ink);font:14px/1.45 var(--font);padding:24px 16px;-webkit-font-smoothing:antialiased}
body.embed{padding:12px}
/* ?tile=1: a tile inside a sample dashboard — no page padding, fills its slot, reports its height */
body.tile{padding:0;background:transparent}
body.tile .viz{padding:14px 16px}
body.tile .viz-head{margin-bottom:10px}
/* in a dashboard a tile shows its default view: layout and option switches belong on the component's own demo page */
body.tile .seg,body.tile .viz-head .btn:not(.xl-btn),body.tile .xl-ctl{display:none!important}
html:has(body.tile),body.tile{overflow:hidden}
body.tile .stage{max-width:none}
html:has(body.tile),body.tile,body.tile .stage{height:100%}
body.tile .stage>.viz{min-height:100%}
.stage{max-width:880px;margin:0 auto}
.viz{background:var(--surface);border:1px solid var(--card-line,var(--border));border-radius:var(--radius);padding:18px 20px;box-shadow:var(--card-edge),var(--card-shadow)}
/* card shadows: ?shadow=flat|soft|lifted|float|edge or postMessage({shadow}); flat is the default. Dark mode deepens the shadow and adds a
   faint top highlight, because a dark shadow on a dark page barely shows. In a dashboard the page draws the outer shadow around each tile. */
:root{--card-shadow:0 0 0 0 transparent;--card-edge:0 0 0 0 transparent;--sh-c:16,24,40;--sh-a:1}
:root[data-theme="dark"]{--sh-c:0,0,0;--sh-a:2.6}

:root[data-shadow="lifted"],:root[data-shadow="edge"]{--card-shadow:0 2px 4px -2px rgba(var(--sh-c),calc(.06*var(--sh-a))),0 8px 18px -6px rgba(var(--sh-c),calc(.14*var(--sh-a)))}

:root[data-shadow="edge"]{--card-edge:inset 5px 0 0 var(--s1)}

body.tile .viz{box-shadow:var(--card-edge)}
.viz-head{display:flex;gap:12px;align-items:flex-start;justify-content:space-between;flex-wrap:wrap;margin-bottom:14px}
.viz-title{font-size:15px;font-weight:600;margin:0;font-family:var(--font-display,var(--font))}
.viz-sub{font-size:13px;color:var(--ink-2);margin:2px 0 0}
.muted{color:var(--muted)} .ink2{color:var(--ink-2)}
.num{font-variant-numeric:tabular-nums}
svg{display:block;overflow:visible}
svg text{fill:var(--muted);font:11px var(--font);font-variant-numeric:tabular-nums}
svg text.ink{fill:var(--ink)} svg text.ink2{fill:var(--ink-2)}
/* controls */
.seg{display:inline-flex;background:var(--surface-2);border-radius:8px;padding:2px;gap:2px}
.seg button{all:unset;cursor:pointer;font-size:12px;padding:4px 10px;border-radius:6px;color:var(--ink-2)}
.seg button:hover{color:var(--ink)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);font-weight:600;box-shadow:0 0 0 1px var(--border)}
.seg button:focus-visible,.btn:focus-visible{outline:2px solid var(--s1);outline-offset:1px}
.btn{all:unset;cursor:pointer;font-size:12px;padding:5px 10px;border-radius:8px;border:1px solid var(--border);color:var(--ink-2);background:var(--surface)}
.btn:hover{background:var(--hover);color:var(--ink)}
input[type=search],input[type=text],select{font:13px var(--font);color:var(--ink);background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:6px 10px}
/* Excel download: an opt-in switch beside the title, and a button whenever a data table is on screen */
.viz-head:has(.xl){justify-content:flex-start} .viz-head:has(.xl)>:first-child{margin-right:auto}
.xl{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.xl-ctl{display:flex;gap:6px;align-items:center;font-size:12px;color:var(--muted)}
.xl-btn[hidden]{display:none}
.legend{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12px;color:var(--ink-2)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.delta{font-size:12px;font-weight:600;white-space:nowrap}
.delta.up{color:var(--up)} .delta.down{color:var(--down)} .delta.flat{color:var(--muted)}
/* tooltip */
.v-tip{position:fixed;z-index:50;pointer-events:none;display:none;background:var(--surface);color:var(--ink);border:1px solid var(--border);border-radius:8px;padding:7px 10px;font-size:12px;line-height:1.45;box-shadow:0 6px 24px rgba(0,0,0,.14);max-width:260px;font-variant-numeric:tabular-nums}
.v-tip b{font-weight:600}
.v-tip .k{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:6px}
/* theme toggle (hidden when embedded) */
.theme-bar{position:fixed;top:10px;right:10px;z-index:40;display:flex;gap:6px;align-items:center}
.theme-bar select{font-size:12px;padding:4px 8px;border-radius:8px}
body.embed .theme-bar{display:none}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
