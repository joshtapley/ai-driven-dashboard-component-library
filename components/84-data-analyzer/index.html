body.embed{padding:12px}
/* ?tile=1: a tile inside a sample dashboard — no page padding, fills its slot, reports its height */
body.tile{padding:0;background:transparent}
body.tile .viz{padding:14px 16px}
body.tile .viz-head{margin-bottom:10px}
/* in a dashboard a tile shows its default view: layout and option switches belong on the component's own demo page */
body.tile .seg,body.tile .viz-head .btn:not(.xl-btn),body.tile .xl-ctl{display:none!important}
html:has(body.tile),body.tile{overflow:hidden}
body.tile .stage{max-width:none}
html:has(body.tile),body.tile,body.tile .stage{height:100%}
body.tile .stage>.viz{min-height:100%}
.stage{max-width:1180px;margin:0 auto}
.viz{background:var(--surface);border:1px solid var(--card-line,var(--border));border-radius:var(--radius);padding:18px 20px;box-shadow:var(--card-edge),var(--card-shadow)}
/* card shadows: ?shadow=flat|soft|lifted|float|edge or postMessage({shadow}); flat is the default. Dark mode deepens the shadow and adds a
   faint top highlight, because a dark shadow on a dark page barely shows. In a dashboard the page draws the outer shadow around each tile. */
:root{--card-shadow:0 0 0 0 transparent;--card-edge:0 0 0 0 transparent;--sh-c:16,24,40;--sh-a:1}
:root[data-theme="dark"]{--sh-c:0,0,0;--sh-a:2.6}
:root[data-shadow="soft"]{--card-shadow:0 1px 2px rgba(var(--sh-c),calc(.06*var(--sh-a))),0 1px 3px rgba(var(--sh-c),calc(.1*var(--sh-a)))}
:root[data-shadow="lifted"],:root[data-shadow="edge"]{--card-shadow:0 2px 4px -2px rgba(var(--sh-c),calc(.06*var(--sh-a))),0 8px 18px -6px rgba(var(--sh-c),calc(.14*var(--sh-a)))}
:root[data-shadow="float"]{--card-shadow:0 4px 8px -4px rgba(var(--sh-c),calc(.08*var(--sh-a))),0 18px 40px -12px rgba(var(--sh-c),calc(.24*var(--sh-a)));--card-line:transparent}
:root[data-shadow="edge"]{--card-edge:inset 5px 0 0 var(--s1)}
:root[data-theme="dark"][data-shadow]:not([data-shadow="flat"]){--card-line:color-mix(in srgb,var(--border) 70%,#fff 6%)}
body.tile .viz{box-shadow:var(--card-edge)}
.viz-head{display:flex;gap:12px;align-items:flex-start;justify-content:space-between;flex-wrap:wrap;margin-bottom:14px}
.viz-title{font-size:15px;font-weight:600;margin:0;font-family:var(--font-display,var(--font))}
.viz-sub{font-size:13px;color:var(--ink-2);margin:2px 0 0}
.muted{color:var(--muted)} .ink2{color:var(--ink-2)}
.num{font-variant-numeric:tabular-nums}
svg{display:block;overflow:visible}
svg text{fill:var(--muted);font:11px var(--font);font-variant-numeric:tabular-nums}
svg text.ink{fill:var(--ink)} svg text.ink2{fill:var(--ink-2)}
/* controls */
.seg{display:inline-flex;background:var(--surface-2);border-radius:8px;padding:2px;gap:2px}
.seg button{all:unset;cursor:pointer;font-size:12px;padding:4px 10px;border-radius:6px;color:var(--ink-2)}
.seg button:hover{color:var(--ink)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);font-weight:600;box-shadow:0 0 0 1px var(--border)}
.seg button:focus-visible,.btn:focus-visible{outline:2px solid var(--s1);outline-offset:1px}
.btn{all:unset;cursor:pointer;font-size:12px;padding:5px 10px;border-radius:8px;border:1px solid var(--border);color:var(--ink-2);background:var(--surface)}
.btn:hover{background:var(--hover);color:var(--ink)}
input[type=search],input[type=text],select{font:13px var(--font);color:var(--ink);background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:6px 10px}
/* Excel download: an opt-in switch beside the title, and a button whenever a data table is on screen */
.viz-head:has(.xl){justify-content:flex-start} .viz-head:has(.xl)>:first-child{margin-right:auto}
.xl{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.xl-ctl{display:flex;gap:6px;align-items:center;font-size:12px;color:var(--muted)}
.xl-btn[hidden]{display:none}
.legend{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12px;color:var(--ink-2)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.delta{font-size:12px;font-weight:600;white-space:nowrap}
.delta.up{color:var(--up)} .delta.down{color:var(--down)} .delta.flat{color:var(--muted)}
/* tooltip */
.v-tip{position:fixed;z-index:50;pointer-events:none;display:none;background:var(--surface);color:var(--ink);border:1px solid var(--border);border-radius:8px;padding:7px 10px;font-size:12px;line-height:1.45;box-shadow:0 6px 24px rgba(0,0,0,.14);max-width:260px;font-variant-numeric:tabular-nums}
.v-tip b{font-weight:600}
.v-tip .k{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:6px}
/* theme toggle (hidden when embedded) */
.theme-bar{position:fixed;top:10px;right:10px;z-index:40;display:flex;gap:6px;align-items:center}
.theme-bar select{font-size:12px;padding:4px 8px;border-radius:8px}
body.embed .theme-bar{display:none}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* ---------- Sample data: fictional and seeded ---------- */
const iso = t => new Date(t).toISOString(), DAY_MS = 864e5, pad2 = n => String(n).padStart(2, "0");
const weighted = (R, list) => { let x = R.r() * list.reduce((s, l) => s + l[1], 0); for (const l of list) { x -= l[1]; if (x <= 0) return l[0]; } return list[0][0]; };
function retailSample() { const R = V.rng(84), t0 = Date.UTC(2023, 0, 2), days = 912, H = ["order_id", "order_date", "state", "channel", "category", "product", "units", "revenue", "cost", "rating", "returned"], rows = [];
  const PROD = { Trail: [["Ridge Pack", 96], ["Switchback Pole", 54], ["Canyon Tent", 240]], Camp: [["Ember Stove", 72], ["Dune Lantern", 34], ["Lowland Cot", 118]], Apparel: [["Fernway Jacket", 138], ["Mesa Shirt", 46], ["Alder Beanie", 22]], Footwear: [["Slate Boot", 164], ["Brook Sandal", 58]] };
  const ST = [["California", 15], ["Texas", 13], ["New York", 10], ["Florida", 10], ["Illinois", 7], ["Pennsylvania", 6], ["Ohio", 6], ["Georgia", 6], ["North Carolina", 5], ["Colorado", 9], ["Washington", 8], ["Oregon", 5]];
  for (let i = 0; i < 1400; i++) { let d; do { d = Math.floor(R.r() * days); } while (R.r() > .45 + d / days * .55); const date = new Date(t0 + d * DAY_MS), m = date.getUTCMonth(), lift = m === 10 || m === 11 ? 1.5 : m === 5 || m === 6 ? 1.15 : 1; if (R.r() > lift / 1.5) continue;
    const cat = weighted(R, [["Trail", 34], ["Camp", 26], ["Apparel", 25], ["Footwear", 15]]), [prod, price] = R.pick(PROD[cat]), web = .34 + d / days * .34, channel = R.r() < web ? "Online" : weighted(R, [["Store", 7], ["Wholesale", 3]]), units = channel === "Wholesale" ? R.int(4, 16) : R.int(1, 3), rev = units * price * (channel === "Wholesale" ? .72 : 1) * (.92 + R.r() * .14), cost = rev * (cat === "Trail" ? .58 : cat === "Camp" ? .62 : .49) * (.95 + R.r() * .1), rating = Math.min(5, Math.max(1, Math.round(3.9 + R.g() * .9 - (cat === "Footwear" ? .5 : 0)))), ret = R.r() < (cat === "Footwear" ? .17 : .06);
    rows.push([`O-${10000 + i}`, iso(date).slice(0, 10), weighted(R, ST), channel, cat, prod, units, rev.toFixed(2), cost.toFixed(2), rating, ret ? "Yes" : "No"]); }
  return { header: H, rows: rows.map(r => r.map(String)) }; }
function supportSample() { const R = V.rng(85), t0 = Date.UTC(2025, 2, 3), H = ["ticket_id", "opened_at", "team", "priority", "channel", "reason", "wait_minutes", "handle_minutes", "csat_score", "resolved"], rows = [];
  for (let i = 0; i < 1200; i++) { const day = Math.floor(R.r() * 168), wd = (new Date(t0 + day * DAY_MS).getUTCDay() + 6) % 7; if (wd > 4 && R.r() < .68) continue; const hour = Math.min(21, Math.max(6, Math.round(13 + R.g() * 3.2))), team = weighted(R, [["Billing", 30], ["Technical", 42], ["Accounts", 18], ["Onboarding", 10]]), pr = weighted(R, [["Low", 44], ["Medium", 37], ["High", 15], ["Urgent", 4]]), base = { Low: 58, Medium: 38, High: 18, Urgent: 7 }[pr] * (team === "Technical" ? 1.35 : 1) * (1 + day / 168 * .45), wait = Math.max(1, base * (.5 + R.r() * 1.1)), handle = Math.max(3, (team === "Technical" ? 31 : 17) * (.6 + R.r() * .9)), csat = Math.min(5, Math.max(1, Math.round(4.6 - wait / 62 + R.g() * .6)));
    rows.push([`T-${50000 + i}`, `${iso(t0 + day * DAY_MS).slice(0, 10)} ${pad2(hour)}:${pad2(R.int(0, 59))}`, team, pr, weighted(R, [["Chat", 44], ["Email", 34], ["Phone", 22]]), weighted(R, [["Login", 20], ["Invoice", 27], ["Outage", 12], ["Setup", 19], ["Refund", 22]]), wait.toFixed(1), handle.toFixed(1), R.r() < .62 ? csat : "", R.r() < .9 ? "Yes" : "No"]); }
  return { header: H, rows: rows.map(r => r.map(String)) }; }
const SAMPLES = { retail: { label: "Retail orders", title: "Retail orders (sample data)", make: retailSample }, support: { label: "Support tickets", title: "Support tickets (sample data)", make: supportSample } };

const $d = id => document.getElementById(id), cache = {}; let sample = "retail", brief = "";
const status = null; void status;

function show(r) { const host = $d("da-out"); host.innerHTML = ""; const root = document.createElement("div"); host.appendChild(root); root.innerHTML = Report.body(r); Report.mount(root, r); brief = r.brief || Analyzer.brief(r); $d("da-copy").hidden = false; }

function loadSample() { const s = SAMPLES[sample]; cache[sample] = cache[sample] || Analyzer.analyze(s.make(), { name: s.title }); show(cache[sample]); say(""); }
const inflate = async b => new Uint8Array(await new Response(new Blob([b]).stream().pipeThrough(new DecompressionStream("deflate-raw"))).arrayBuffer());
async function runFile(f) { say("Analyzing " + f.name + "…"); await new Promise(r => setTimeout(r, 30)); try { const t = /\.xlsx$/i.test(f.name) ? await Analyzer.parseXlsx(new Uint8Array(await f.arrayBuffer()), inflate) : Analyzer.parseDelimited(await f.text()), s0 = performance.now(), r = Analyzer.analyze(t, { name: f.name.replace(/\.[^.]+$/, "") }); show(r); say("Done in " + ((performance.now() - s0) / 1000).toFixed(1) + " s."); $d("da-sample").querySelectorAll("button").forEach(b => b.setAttribute("aria-pressed", "false")); } catch (e) { say("Couldn't read that file: " + e.message, true); } }
